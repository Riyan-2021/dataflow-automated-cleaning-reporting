[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-cleaning-reporting"
version = "1.0.0"
description = "Automated data cleaning and reporting system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "openpyxl>=3.1,<4.0",
    "matplotlib>=3.7,<4.0",
]

[project.scripts]
dataflow = "dataflow.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
